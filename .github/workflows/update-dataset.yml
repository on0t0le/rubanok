name: Update Dataset

on:
  schedule:
    - cron: "0 2 * * *"   # 2:00 AM UTC daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

concurrency:
  group: update-dataset
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # needed to push to gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: pipeline/go.sum

      - name: Build pipeline binary
        run: cd pipeline && go build -o ../pipeline-bin ./cmd/pipeline

      - name: Import OpenSanctions (UA NSDC)
        run: ./pipeline-bin import opensanctions

      - name: Import KSE Leave Russia
        run: ./pipeline-bin import kse

      - name: Import brands (Wikidata + Open Food Facts)
        run: ./pipeline-bin import brands

      - name: Import WSRW (who-support-rus-war.com)
        run: ./pipeline-bin import wsrw

      - name: Merge entities
        run: ./pipeline-bin merge --overrides data/overrides.json

      - name: Import barcodes (Open Food Facts)
        run: ./pipeline-bin import barcodes

      - name: Export dataset
        run: ./pipeline-bin export --output output

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true    # keep gh-pages branch lean (no history)
